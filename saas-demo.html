<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>内容巡查研判平台 · 浅色 SaaS 可点击 Demo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232563eb'/%3E%3Cpath d='M8 11h16v3H8zm0 7h16v3H8z' fill='white'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css" />
<style>
:root{
 --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
 --surface-0:#f5f6f8;--surface-1:#eceef1;--surface-2:#ffffff;
 --border:rgba(15,18,25,0.10);--border-strong:rgba(15,18,25,0.18);--border-accent:#9ec0ea;
 --text-primary:#1b1d22;--text-secondary:#5b5f67;--text-muted:#8a8e96;
 --text-accent:#185fa5;--text-danger:#a32d2d;--text-warning:#854f0b;--text-success:#0f6e56;
 --bg-accent:#e6f1fb;--bg-danger:#fcebeb;--bg-warning:#faeeda;--bg-success:#e1f5ee;
 --fill-accent:#2563eb;--radius:8px;
}
@media (prefers-color-scheme:dark){:root{
 --surface-0:#16181c;--surface-1:#1f2228;--surface-2:#23262d;
 --border:rgba(255,255,255,0.10);--border-strong:rgba(255,255,255,0.18);--border-accent:#2f5a87;
 --text-primary:#e9eaed;--text-secondary:#a7abb3;--text-muted:#7c8088;
 --text-accent:#85b7eb;--text-danger:#f09595;--text-warning:#efc785;--text-success:#9fe1cb;
 --bg-accent:#0c2740;--bg-danger:#3a1717;--bg-warning:#3a2a0d;--bg-success:#0c2c25;
 --fill-accent:#3b82f6;
}}
html,body{margin:0;background:var(--surface-1);color:var(--text-primary);font-family:var(--font-sans)}
.page-wrap{max-width:1220px;margin:24px auto;padding:0 16px}
.cmapp{font-family:var(--font-sans);color:var(--text-primary);background:var(--surface-0);border:0.5px solid var(--border);border-radius:12px;position:relative;overflow:hidden;box-shadow:0 6px 24px rgba(15,18,25,0.08)}
.cmapp *{box-sizing:border-box}
.cm-top{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:0.5px solid var(--border);background:var(--surface-2);flex-wrap:wrap}
.cm-brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.cm-mark{width:30px;height:30px;border-radius:8px;background:var(--bg-accent);color:var(--text-accent);display:flex;align-items:center;justify-content:center;font-size:17px}
.cm-brand b{font-weight:500;font-size:14px;display:block;line-height:1.2}
.cm-brand small{color:var(--text-muted);font-size:11px}
.cm-nav{display:flex;gap:4px;flex-wrap:wrap}
.cm-tab{font:inherit;font-size:13px;padding:6px 12px;border-radius:var(--radius);border:0.5px solid transparent;background:transparent;color:var(--text-secondary);cursor:pointer}
.cm-tab:hover{background:var(--surface-1)}
.cm-tab.on{background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent)}
.cm-body{padding:18px 20px}
.cm-ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.cm-ph h1{font-size:20px;font-weight:500;margin:0}
.cm-ph p{font-size:13px;color:var(--text-secondary);margin:4px 0 0}
.cm-acts{display:flex;gap:8px;flex-wrap:wrap}
.cm-btn{font:inherit;font-size:13px;padding:7px 12px;border-radius:var(--radius);border:0.5px solid var(--border-strong);background:var(--surface-2);color:var(--text-primary);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.cm-btn:hover{background:var(--surface-1)}
.cm-btn.pri{background:var(--fill-accent);color:#fff;border-color:transparent}
.cm-btn.dang{background:#dc2626;color:#fff;border-color:transparent}
.cm-btn.dang:hover{background:#b91c1c}
.cm-btn.sm{padding:4px 10px;font-size:12px}
.cm-bd{display:inline-flex;align-items:center;font-size:11px;padding:2px 8px;border-radius:6px;background:var(--surface-1);color:var(--text-secondary);font-weight:500}
.cm-bd.dang{background:var(--bg-danger);color:var(--text-danger)}
.cm-bd.warn{background:var(--bg-warning);color:var(--text-warning)}
.cm-bd.ok{background:var(--bg-success);color:var(--text-success)}
.cm-bd.info{background:var(--bg-accent);color:var(--text-accent)}
.cm-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:16px}
.cm-stat{background:var(--surface-1);border-radius:var(--radius);padding:12px 14px}
.cm-stat span{font-size:12px;color:var(--text-secondary);display:block}
.cm-stat b{font-size:24px;font-weight:500;display:block;margin:2px 0}
.cm-stat small{font-size:11px;color:var(--text-muted)}
.cm-stat.dang b{color:var(--text-danger)}
.cm-stat.warn b{color:var(--text-warning)}
.cm-stat.ok b{color:var(--text-success)}
.cm-filter-shell{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:end;gap:14px;padding:12px 14px;margin-bottom:16px;border:0.5px solid var(--border);border-radius:var(--radius);background:var(--surface-2)}
.cm-filter-heading{display:flex;align-items:center;gap:8px;align-self:center;min-width:104px}
.cm-filter-heading>i{font-size:18px;color:var(--text-accent)}
.cm-filter-heading span{display:block;min-width:0}
.cm-filter-heading b{display:block;font-size:12px;font-weight:500;color:var(--text-primary)}
.cm-filter-heading small{display:block;margin-top:1px;font-size:10px;color:var(--text-muted);white-space:nowrap}
.cm-filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;min-width:0}
.cm-filter-field{display:flex;flex-direction:column;gap:4px;min-width:0}
.cm-filter-field span{font-size:11px;color:var(--text-muted)}
.cm-filter-select{width:100%;height:36px;min-width:0;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:var(--surface-0);color:var(--text-primary);font:inherit;font-size:12px;padding:0 30px 0 10px;cursor:pointer}
.cm-filter-select:focus{outline:none;box-shadow:0 0 0 2px var(--bg-accent);border-color:var(--border-accent)}
.cm-filter-select.on{background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent)}
.cm-filter-reset{width:36px;height:36px;padding:0;justify-content:center;align-self:end}
.cm-filter-reset i{font-size:16px}
.cm-filter-reset:disabled{opacity:.4;cursor:not-allowed;background:var(--surface-1)}
.cm-output-toolbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:10px 0 6px}
.cm-output-toolbar>span{padding-bottom:8px;font-size:12px;color:var(--text-secondary)}
.cm-fg{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.cm-fg>em{font-style:normal;font-size:11px;color:var(--text-muted)}
.cm-chip{font:inherit;font-size:12px;padding:4px 10px;border-radius:999px;border:0.5px solid var(--border);background:var(--surface-2);color:var(--text-secondary);cursor:pointer}
.cm-chip.on{background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent)}
.cm-card{background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:13px 16px;margin-bottom:10px}
.cm-card.clk{cursor:pointer}
.cm-card.clk:hover{border-color:var(--border-strong)}
.cm-card-top{display:flex;align-items:center;gap:6px;margin-bottom:7px;flex-wrap:wrap}
.cm-card-top .t{color:var(--text-muted);font-size:11px;margin-left:auto}
.cm-card h3{font-size:16px;font-weight:500;margin:0 0 4px}
.cm-card .desc{font-size:13px;color:var(--text-secondary);margin:0 0 9px;line-height:1.5}
.cm-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
.cm-tag{font-size:11px;color:var(--text-secondary);background:var(--surface-1);padding:2px 8px;border-radius:6px}
.cm-tag i{font-size:12px;margin-right:3px;vertical-align:-1px}
.cm-card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:0.5px solid var(--border);padding-top:9px;flex-wrap:wrap}
.cm-acct{font-size:12px;color:var(--text-secondary)}
.cm-acct b{color:var(--text-primary);font-weight:500}
.cm-mini{display:flex;gap:6px;flex-wrap:wrap}
.cm-panel{background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.cm-panel h2{font-size:15px;font-weight:500;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.cm-panel .sub{font-size:12px;color:var(--text-secondary);margin:0 0 10px}
.cm-panel h3{font-size:13px;font-weight:500;margin:14px 0 8px;color:var(--text-secondary)}
.cm-collapsible{padding:0;overflow:hidden}
.cm-panel-head{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;border:0;background:transparent;color:var(--text-primary);font:inherit;text-align:left;padding:16px 18px 10px;cursor:pointer}
.cm-panel-head:hover{background:var(--surface-1)}
.cm-panel-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500}
.cm-panel-head>.ti{font-size:18px;color:var(--text-muted);flex:0 0 auto}
.cm-panel-body{padding:0 18px 16px}
.cm-panel-body>.sub:first-child{margin-top:0}
.cm-collapsible.is-collapsed .cm-panel-head{padding-bottom:16px}
.cm-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.cm-kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:0.5px solid var(--border);font-size:13px}
.cm-kv:last-child{border-bottom:none}
.cm-kv span{color:var(--text-secondary)}
.cm-kv b{font-weight:500;text-align:right;overflow-wrap:anywhere}
.cm-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.cm-tile{background:var(--surface-1);border-radius:var(--radius);padding:12px 8px;text-align:center;font-size:11px;color:var(--text-secondary);border:0.5px solid var(--border)}
.cm-tile i{display:block;font-size:19px;margin-bottom:5px;color:var(--text-muted)}
.cm-frame{background:var(--surface-1);border:0.5px dashed var(--border-strong);border-radius:var(--radius);height:130px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:12px;margin-bottom:10px;flex-direction:column;gap:6px}
.cm-frame i{font-size:28px}
.cm-original-media{margin-bottom:10px}
.cm-original-cover{border:0.5px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--surface-1);margin-bottom:10px}
.cm-original-cover img{display:block;width:100%;max-height:320px;object-fit:contain;background:var(--surface-0)}
.cm-original-cover figcaption{padding:6px 8px;font-size:11px;color:var(--text-muted);line-height:1.35}
.cm-original-video{border:0.5px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--surface-1);margin-bottom:10px}
.cm-original-video video{display:block;width:100%;max-height:560px;background:#000}
.cm-original-video figcaption{padding:8px 10px;font-size:11px;color:var(--text-muted);line-height:1.35}
.cm-original-gallery{border:0.5px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--surface-1);margin-bottom:10px}
.cm-gallery-stage{position:relative;background:var(--surface-0);min-height:340px;display:flex;align-items:center;justify-content:center}
.cm-gallery-stage img{display:block;width:100%;max-height:520px;object-fit:contain}
.cm-gallery-nav{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:0.5px solid rgba(15,18,25,0.18);background:rgba(255,255,255,0.86);color:var(--text-primary);display:flex;align-items:center;justify-content:center;cursor:pointer}
.cm-gallery-nav:hover{background:#fff}
.cm-gallery-nav.prev{left:10px}
.cm-gallery-nav.next{right:10px}
.cm-gallery-nav i{font-size:18px}
.cm-gallery-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;color:var(--text-secondary);font-size:12px}
.cm-gallery-dots{display:flex;gap:5px;align-items:center;overflow:hidden}
.cm-gallery-dot{width:7px;height:7px;border-radius:50%;border:0;background:var(--border-strong);padding:0;cursor:pointer}
.cm-gallery-dot.on{background:var(--fill-accent)}
.cm-original-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;max-height:360px;overflow:auto;padding-right:2px}
.cm-original-image{border:0.5px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--surface-1)}
.cm-original-image img{display:block;width:100%;height:180px;object-fit:contain;background:var(--surface-0)}
.cm-original-image figcaption{padding:6px 8px;font-size:11px;color:var(--text-muted);line-height:1.35}
.cm-original-text{font-size:12px;line-height:1.5;color:var(--text-secondary);background:var(--surface-1);border-radius:var(--radius);padding:8px 10px;margin-bottom:8px;white-space:pre-wrap}
.cm-video-sheets{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin:6px 0 10px}
.cm-video-sheet{border:0.5px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--surface-1)}
.cm-video-sheet img{display:block;width:100%;height:auto;background:var(--surface-1)}
.cm-video-sheet span{display:block;padding:6px 8px;font-size:11px;color:var(--text-muted)}
.cm-video-sheet p{margin:0;padding:0 8px 8px;font-size:11px;line-height:1.45;color:var(--text-secondary)}
.cm-video-summary{font-size:12px;color:var(--text-secondary);padding:8px 10px;border-radius:var(--radius);background:var(--surface-1);line-height:1.5;margin-bottom:8px;white-space:pre-line}
.cm-cmt{font-size:12px;color:var(--text-secondary);padding:7px 10px;border-radius:var(--radius);background:var(--surface-1);margin-bottom:6px}
.cm-cmt b{color:var(--text-primary);font-weight:500}
.cm-cmt.hit{background:var(--bg-danger);color:var(--text-danger)}
.cm-cmt.hit b{color:var(--text-danger)}
.cm-user-output{width:100%;display:flex;align-items:center;gap:10px;text-align:left;font:inherit;color:var(--text-primary);background:transparent;border:0;border-top:0.5px solid var(--border);padding:9px 8px;cursor:pointer}
.cm-user-output:first-child{border-top:0}
.cm-user-output:hover{background:var(--surface-1);border-radius:var(--radius)}
.cm-user-output-main{display:block;min-width:0;flex:1}
.cm-user-output-main b{display:block;font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm-user-output-main small{display:block;margin-top:2px;font-size:11px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm-user-output-side{display:flex;align-items:center;gap:7px;flex:0 0 auto}
.cm-user-output-side i{font-size:16px;color:var(--text-muted)}
.cm-user-output-summary{padding:7px 8px 0;font-size:11px;color:var(--text-muted);border-top:0.5px solid var(--border)}
.cm-comment-pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0 6px;color:var(--text-secondary);font-size:12px}
.cm-comment-pager .cm-mini{margin-left:auto}
.cm-comment-list{max-height:520px;overflow:auto;padding-right:2px}
.cm-cmt-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cm-cmt-user{min-width:0;overflow-wrap:anywhere}
.cm-cmt-actions{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap;margin-left:auto}
.cm-cmt-actions .cm-bd{white-space:nowrap}
.cm-cmt p{margin:3px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.cm-cond{display:flex;align-items:center;gap:8px;padding:8px 10px;border:0.5px solid var(--border);border-radius:var(--radius);margin-bottom:6px;font-size:12px}
.cm-cond b{font-weight:500;color:var(--text-primary);margin-right:auto}
.cm-cond .w{color:var(--text-muted)}
.cm-score-list{display:grid;gap:8px}
.cm-score-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;padding:11px 12px;border:0.5px solid var(--border);border-radius:var(--radius);background:var(--surface-2)}
.cm-score-main{min-width:0}
.cm-score-main b{display:block;font-size:13px;font-weight:500;color:var(--text-primary)}
.cm-score-main small{display:block;margin-top:3px;color:var(--text-muted);font-size:11px;line-height:1.35}
.cm-score-controls{display:flex;justify-content:flex-end;align-items:center}
.cm-score-field{display:grid;grid-template-columns:auto 132px;gap:10px;align-items:center}
.cm-score-field>span{color:var(--text-muted);font-size:11px;white-space:nowrap}
.cm-score-field .cm-mini-select{width:132px;padding:0 30px;text-align:center;text-align-last:center;font-weight:600}
.cm-task{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:start;padding:14px 16px;border:0.5px solid var(--border);border-radius:12px;margin-bottom:10px;background:var(--surface-2)}
.cm-task .tm b{font-size:14px;font-weight:500;display:block}
.cm-task .tm span{font-size:12px;color:var(--text-secondary)}
.cm-task .tm small{font-size:11px;color:var(--text-muted);display:block;margin-top:2px}
.cm-task .ts{text-align:right;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.cm-task .ts b{font-size:12px;font-weight:500}
.cm-task .ts b.d{color:var(--text-danger)}
.cm-task-acts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;border-top:0.5px solid var(--border);padding-top:9px}
.cm-types{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:6px}
.cm-type{text-align:left;font:inherit;cursor:pointer;background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:14px;color:var(--text-primary)}
.cm-type:hover{border-color:var(--border-strong)}
.cm-type.on{border-color:var(--border-accent);background:var(--bg-accent)}
.cm-type i{font-size:22px;color:var(--text-accent)}
.cm-type b{display:block;font-weight:500;font-size:14px;margin:8px 0 3px}
.cm-type span{font-size:12px;color:var(--text-secondary);line-height:1.4}
.cm-choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin:10px 0}
.cm-choice{display:flex;gap:9px;align-items:flex-start;padding:11px;border:0.5px solid var(--border);border-radius:var(--radius);cursor:pointer;font-size:12px;background:var(--surface-2)}
.cm-choice.on{border-color:var(--border-accent);background:var(--bg-accent)}
.cm-choice i{font-size:16px;margin-top:1px;color:var(--text-accent)}
.cm-choice b{display:block;font-weight:500}
.cm-choice small{color:var(--text-secondary)}
.cm-pills{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.cm-pill{min-width:96px;display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:12px;padding:7px 11px;border-radius:var(--radius);border:0.5px solid var(--border);background:var(--surface-2);color:var(--text-secondary);cursor:pointer}
.cm-pill i{font-size:15px;color:var(--text-muted)}
.cm-pill.on{background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent)}
.cm-pill.on i{color:var(--text-accent)}
.cm-field{display:block;margin-top:12px;max-width:720px}
.cm-field span{display:block;font-size:12px;color:var(--text-secondary);margin-bottom:5px}
.cm-field input{width:100%;height:36px;padding:0 11px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:var(--surface-2);color:var(--text-primary);font:inherit;font-size:13px}
.cm-field input:focus{outline:none;box-shadow:0 0 0 2px var(--bg-accent);border-color:var(--border-accent)}
.cm-scheme{text-align:left;font:inherit;cursor:pointer;background:var(--surface-2);border:0.5px solid var(--border);border-radius:var(--radius);padding:11px 13px;color:var(--text-primary);width:100%;margin-bottom:8px}
.cm-scheme.on{border-color:var(--border-accent);background:var(--bg-accent)}
.cm-scheme b{display:block;font-weight:500;font-size:13px}
.cm-scheme small{font-size:11px;color:var(--text-secondary)}
.cm-user{text-align:left;font:inherit;cursor:pointer;background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:12px 14px;color:var(--text-primary);width:100%;margin-bottom:8px}
.cm-user:hover{border-color:var(--border-strong)}
.cm-user.on{border-color:var(--border-accent);background:var(--bg-accent)}
.cm-user b{font-weight:500;display:flex;justify-content:space-between;align-items:center}

function assetUrl(jobId,path){
 if(!jobId||!path)return "";
 return apiUrl("/api/jobs/"+encodeURIComponent(jobId)+"/assets?path="+encodeURIComponent(path));
}
function mediaAssetUrl(jobId,path){
 if(!path)return "";
 var s=String(path);
 if(/^https?:\/\//i.test(s))return s;
 if(jobId){
   var marker="/outputs/"+jobId+"/";
   var p=s.indexOf(marker);
   if(p>-1)s=s.slice(p+marker.length);
   return assetUrl(jobId,s);
 }
 return "";
}
function truncateUiText(s,n){
 s=String(s||"").trim();
 return s.length>n?s.slice(0,n-1)+"...":s;
}
function addMediaItem(out,seen,label,path,caption){
 var key=String(path||"").trim();
 if(!key||seen[key])return;
 seen[key]=1;
 out.push({label:label,path:key,caption:caption||""});
}
function mediaDedupeKey(path,jobId){
 var s=String(path||"").trim();
 if(!s)return "";
 s=s.replace(/[?#].*$/,"");
 if(jobId){
   var marker="/outputs/"+jobId+"/";
   var p=s.indexOf(marker);
   if(p>-1)s=s.slice(p+marker.length);
 }
 return s.replace(/^file:\/\//,"").replace(/^\/+/,"");
}

   addMediaItem(out,seen,"图 "+(out.length+1),x.asset_rel||x.local_path||x.path_or_url||x.url,"");

function collectOriginalVideos(r,detail){
 var audit=(detail&&detail.audit_result)||r.raw||{};
 var idx=audit.evidence_index||{};
 var jobId=audit.job_id||((r.raw||{}).job_id)||"";
 var out=[],seen={};
 function addVideo(label,x,caption){
   x=x||{};
   var candidates=[
     x.asset_rel,x.local_path,x.path,x.video_path,x.url,x.video_url,x.video_play_url,x.video_download_url,
     x.play_url,x.download_url,x.source_url
   ];
   for(var c=0;c<candidates.length;c++){
     if(candidates[c]){
       var path=String(candidates[c]||"").trim();
       var key=mediaDedupeKey(path,jobId);
       if(seen[key])return;
       seen[key]=1;
       out.push({label:label,path:path,caption:caption||""});
       return;
     }
   }
 }
 safeArr(idx.video_units).forEach(function(x,i){
   addVideo("原始视频 "+(i+1),x,firstText(x.transcript_summary,x.summary));
 });
 safeArr(audit.video_results).forEach(function(x,i){
   addVideo("原始视频 "+(out.length+1),x,firstText((x.transcript||{}).text_zh,(x.transcript||{}).text,x.summary));
 });

function videoSummaryFromIndex(idx,audit){
 audit=audit||{};
 var momentTexts=[],fallbackTexts=[];
 function momentText(x){
   var analysis=(x&&x.analysis)||x||{};
   return firstText(analysis.summary,x.summary,analysis.safe_context,x.safe_context,analysis.reason,x.reason,analysis.visual_summary,x.visual_summary);
 }
 function preciseText(x){
   return firstText(x&&x.safe_context,x&&x.visual_summary,x&&x.reason,x&&x.summary);
 }
 safeArr(idx.moments).forEach(function(x){var text=momentText(x);if(text)momentTexts.push(text);});
 safeArr(idx.video_units).forEach(function(v){safeArr(v.moments).forEach(function(x){var text=momentText(x);if(text)momentTexts.push(text);});});
 safeArr(audit.video_results).forEach(function(v){
   safeArr((v||{}).moments).forEach(function(x){var text=momentText(x);if(text)momentTexts.push(text);});
   safeArr((v||{}).precise_sheets).forEach(function(x){var text=preciseText(x);if(text)fallbackTexts.push(text);});
 });
 safeArr(idx.precise_sheets).forEach(function(x){var text=preciseText(x);if(text)fallbackTexts.push(text);});
 var texts=momentTexts.length?momentTexts:fallbackTexts;
 var seen={},out=[];
 for(var i=0;i<texts.length;i++){var t=String(texts[i]||"").trim();if(t&&!/^<[^>]+>(<[^>]+>)*$/.test(t)&&!seen[t]){seen[t]=1;out.push(t);}}
 return truncateUiText(out.join("\n"),900);
}

function scTasks(){

 var recentCutoff=Date.now()-7*24*60*60*1000;
 var recentRisks=risks.filter(function(r){
   if(r.level==="无风险")return false;
   var stamp=riskOutputTime(r),time=Date.parse(stamp);
   return !stamp||!Number.isFinite(time)||time>=recentCutoff;
 }).length;
 var userTasks=tasks.filter(function(t){return t.type==="重点用户监控";}).length;
 var platformTasks=tasks.filter(function(t){return t.type==="平台内容抓取";}).length;
 var rows="";for(var i=0;i<tasks.length;i++){rows+=taskRow(tasks[i]);}
 return ph("监控任务","平台抓取、直播接入、重点用户、本地视频四类来源的运行操作台",

}

function methodText(ms){var map={keyword:"黑话关键词",tag:"话题标签",comment:"评论扩散",ocr:"图片/OCR","live-video":"实时画面",asr:"语音转写",danmu:"弹幕分析",replay:"回放补采",profile:"主页资料",posts:"发布内容",interaction:"互动关系",live:"直播行为",frame:"逐帧视觉",keyframe:"关键帧导出"};return ms.map(function(m){return map[m]||m;}).join(" / ");}
function schemeCategoryText(s){var cats=[];for(var i=0;i<s.libIds.length;i++){var c=getLib(s.libIds[i]).category;if(cats.indexOf(c)<0)cats.push(c);}return cats.join(" / ")||"未选择";}
function attr(s){return String(s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function taskTargetText(nt){if(nt.type==="video")return nt.fileName||"待选择视频";var p=nt.platforms.join(" / ")||"待选择平台";if(nt.type==="user")return p+" · "+(nt.userUrl||"待填写用户 URL");return p;}
function compactTargetText(text){
 text=String(text||"").trim();
 if(!text)return "";
 var m=text.match(/^(.*?·\s*)?(https?:\/\/\S+)$/i);
 if(m){
   var prefix=String(m[1]||"").trim();
   var url=String(m[2]||"").replace(/[\/?#]+$/,"");
   var tail=url.slice(-10);
   return (prefix?prefix+" ":"")+"用户尾号 "+tail;
 }
 return text;
}

function schemeRefTasks(s){return tasks.filter(function(t){return t.config.indexOf(s.name)>-1;});}
function libSchemes(id){return schemes.filter(function(s){return s.libIds.indexOf(id)>-1;});}
function scopeDef(id){for(var i=0;i<scopeDefs.length;i++)if(scopeDefs[i].id===id)return scopeDefs[i];return scopeDefs[0];}
function capDef(id){for(var i=0;i<capabilityDefs.length;i++)if(capabilityDefs[i].id===id)return capabilityDefs[i];return capabilityDefs[0];}
function templateDef(id){for(var i=0;i<templateDefs.length;i++)if(templateDefs[i].id===id)return templateDefs[i];return templateDefs[0];}
function cloneMap(obj){var o={};for(var k in obj){if(obj.hasOwnProperty(k))o[k]=obj[k];}return o;}
function schemeCaps(s){
 if(s.caps&&s.caps.length)return s.caps.slice();
 var m=(s.modal||"").toLowerCase();var ids=[];
 if(/文本|标题|正文|评论|弹幕|text/.test(s.modal||""))ids.push("text");
 if(/ocr/.test(m))ids.push("ocr");
 if(/asr|语音|口播|音频/.test(m))ids.push("asr");
 if(/视觉|画面|图片|视频|关键帧|封面|vision/.test(s.modal||""))ids.push("vision");
 if(/评论|弹幕|互动|comment/.test(s.modal||""))ids.push("comment");
 var uniq=[];for(var i=0;i<ids.length;i++)if(uniq.indexOf(ids[i])<0)uniq.push(ids[i]);
 ids=uniq;
 if(!ids.length)ids=["text","ocr","asr","vision","comment"];
 return ids;
}
function schemeScopes(s){if(s.scopes&&s.scopes.length)return s.scopes.slice();return ["title_body","comment","image","video","audio"];}
function schemeTemplate(s){return s.template||"balanced";}
function schemeImportance(s){var t=templateDef(schemeTemplate(s));var m=s.ruleImportance?cloneMap(s.ruleImportance):cloneMap(t.weights);var ids=schemeCaps(s);for(var i=0;i<ids.length;i++)if(!m[ids[i]])m[ids[i]]=t.weights[ids[i]]||"medium";return m;}
function capsToModal(ids){var labels=[];for(var i=0;i<capabilityDefs.length;i++)if(ids.indexOf(capabilityDefs[i].id)>-1)labels.push(capabilityDefs[i].short);return labels.join(" / ")||"文本";}
function thresholdsFromText(text){var t=text||"";function pick(name,fb){var re=new RegExp(name+"[^0-9]*(\\d+)");var m=t.match(re);return m?parseInt(m[1],10):fb;}return {high:pick("高危",85),medium:pick("中危",65),review:pick("待复核",45)};}
function thresholdsOf(s){return s.thresholds||thresholdsFromText(s.th);}
function thresholdsText(th){return "高危≥"+th.high+" · 中危≥"+th.medium+" · 待复核≥"+th.review;}
function readThresholds(prefix,fb){function num(id,val){var e=document.getElementById(prefix+"-"+id);var n=e?parseInt(e.value,10):NaN;return isNaN(n)?val:Math.max(0,Math.min(100,n));}return {high:num("high",fb.high),medium:num("medium",fb.medium),review:num("review",fb.review)};}
function scoringRulesForScheme(s){
 var out=[],libs=s.libIds||[],caps=schemeCaps(s),imp=schemeImportance(s),tmpl=templateDef(schemeTemplate(s)).weights;
 var sources=caps.slice();
 for(var li=0;li<libs.length;li++){
   var L=getLib(libs[li]),bid=libraryBackendId(libs[li]),cat=L.category||L.name||bid;
   for(var si=0;si<sources.length;si++){
     var src=sources[si],level=imp[src]||tmpl[src]||"medium",score=importanceScores[level]||0;
     if(score<=0)continue;
     out.push({id:src+"_"+bid,label:cat+capDef(src).rule,source:src,library_id:bid,category:cat,importance:level,score:score});
   }
 }
 return out;
}
function schemePolicyPayload(s){
 var th=thresholdsOf(s),imp=schemeImportance(s);
 return {name:s.name||"未命名研判方案",description:"",library_ids:(s.libIds||[]).map(libraryBackendId),capabilities:schemeCaps(s),scoring_template:schemeTemplate(s),
  rule_snapshot:{thresholds:th,scoring_rules:scoringRulesForScheme(s),rule_importance:imp},config:{library_ids:(s.libIds||[]).map(libraryBackendId),capabilities:schemeCaps(s),scopes:schemeScopes(s),scoring_template:schemeTemplate(s),rule_importance:imp,outputs:s.outputs||deriveSchemeOutputs(s),rule_snapshot:{thresholds:th,scoring_rules:scoringRulesForScheme(s),rule_importance:imp}}};
}
function saveSchemePolicy(s,publish){
 var payload=schemePolicyPayload(s),id=s.policyId||s.id,method=id&&String(id).indexOf("scx")!==0?"PATCH":"POST",path=method==="PATCH"?"/api/audit-policies/"+id:"/api/audit-policies";
 st.apiLoading=true;R();
 apiFetch(path,{method:method,body:JSON.stringify(payload)}).then(function(saved){

 else if(a==="pickFile"){var vf=document.getElementById("nt-video-file");if(vf)vf.click();return;}
 else if(a==="createTask"){
   st.nt.name=(val("nt-task-name")||st.nt.name||"未命名监控任务").trim();
   if(st.nt.type==="user")st.nt.userUrl=(val("nt-user-url")||st.nt.userUrl||"").trim();
   if(st.nt.type==="user"&&!st.nt.userUrl){msg=["请先填写用户 URL","重点用户监控需要明确主页链接"];}
   else if(st.apiReady){submitCreateTask();return;}
   else{
   var nm=st.nt.name==="未命名监控任务"?typeTitle[st.nt.type]+" · 新任务":st.nt.name;
   var exist=false;for(var z=0;z<tasks.length;z++)if(tasks[z].id==="T-NEW")exist=true;
   var createScheme=getScheme(st.nt.scheme);
   var newRow={id:"T-NEW",name:nm,type:typeTitle[st.nt.type],target:taskTargetText(st.nt),config:createScheme.name,status:"运行中",prog:8,riskN:0,hot:0,updated:"刚刚"};
   if(exist){tasks[tasks.length-1]=newRow;}else{tasks.push(newRow);}
	   var returned=returnFromNewTask("tasks");msg=["任务已创建",returned?nm+" 已开始采集，已返回该帖子分析页面":nm+" 已开始采集，命中异常后进入工作台"];
   }
 }
 else if(a==="selUser"){st.userId=d.id;}
 else if(a==="tagFocus"){var tf=el.querySelector(".cm-tagfield");if(tf)tf.focus();return;}
 else if(a==="tagDel"){e.preventDefault();e.stopPropagation();var btn=el.closest('button[data-act="tagDel"]')||el;var tk=btn.dataset.key;if(removeTagValue(tk,btn.dataset.idx,btn.dataset.value))refreshTags(tk);return;}
 else if(a==="toast"){msg=[d.t,d.d||""];}
 R();
 if(msg)toast(msg[0],msg[1]);
});

root.addEventListener("input",function(e){
 if(st.cfgView==="schemeNew"&&(e.target.id==="ns2-name"||/^ns2-th-/.test(e.target.id||""))){
   syncNewSchemeDraft();
 }
 var el=e.target.closest("[data-act]");if(!el)return;
 var a=el.dataset.act;
 if(a==="ntTaskName"){
   st.nt.name=el.value.trim();
   var np=document.getElementById("nt-name-preview");if(np)np.textContent=st.nt.name||"未命名监控任务";
 }
 else if(a==="ntUserUrl"){
   st.nt.userUrl=el.value.trim();
   var pv=document.getElementById("nt-target-preview");if(pv)pv.textContent=compactTargetText(taskTargetText(st.nt));
 }
});

root.addEventListener("change",function(e){
 if(st.cfgView==="schemeNew"&&e.target.classList&&e.target.classList.contains("cfg-lib")){
   syncNewSchemeDraft();
   return;
 }
 if(st.cfgView==="schemeNew"&&/^ns2-th-/.test(e.target.id||"")){
   syncNewSchemeDraft();
   return;
 }
 var levelEl=e.target.closest('[data-act="taskOutputLevel"]');
 if(levelEl){
   var levelKey=levelEl.dataset.id||"current";
   st.taskOutputLevel[levelKey]=levelEl.value||"全部";
   st.taskOutputPage[levelKey]=1;
   R();
   return;
 }
 var fileEl=e.target.closest("#nt-video-file");
 if(fileEl){
   var f=fileEl.files&&fileEl.files[0];
   if(f){st.nt.file=f;st.nt.fileName=f.name;st.nt.fileLoaded=true;R();toast("文件已选择",f.name);}
   return;
 }
 syncNewSchemeDraft();
 var el=e.target.closest("select[data-act]");if(!el)return;
 var a=el.dataset.act,d=el.dataset,msg=null;
 if(a==="filterSelect"){st.filters[d.kind]=el.value;st.riskPage=1;}
 else if(a==="schemeRuleImportance"){
   var sr=getScheme(st.schemeId);flushScheme(sr);if(!sr.ruleImportance)sr.ruleImportance=cloneMap(templateDef(schemeTemplate(sr)).weights);
   sr.ruleImportance[d.cap]=el.value;recomputeScheme(sr);st.pendingChanges++;msg=["评分规则已更新",capDef(d.cap).rule+" · "+importanceLabels[el.value]];
 }
 else if(a==="nsRuleImportance"){
   if(!st.nsImportance)st.nsImportance=cloneMap(templateDef(st.nsTemplate||"balanced").weights);
   st.nsImportance[d.cap]=el.value;msg=["评分规则已更新",capDef(d.cap).rule+" · "+importanceLabels[el.value]];
 }
 R();
 if(msg)toast(msg[0],msg[1]);
});

root.addEventListener("keydown",function(e){
 var inp=e.target.closest(".cm-tagfield");if(!inp)return;
 var key=inp.dataset.key;
 if(e.key==="Enter"){
   e.preventDefault();var parts=splitTagText(inp.value);if(!parts.length)return;
   if(!st.tags[key])st.tags[key]=[];
   parts.forEach(function(x){if(st.tags[key].indexOf(x)<0)st.tags[key].push(x);});
   inp.value="";refreshTags(key);
 } else if(e.key==="Backspace"&&inp.value===""){
   if(st.tags[key]&&st.tags[key].length){st.tags[key].pop();refreshTags(key);}
 }
});

R();
loadSaasData().then(startAutoRefresh);
	})();
</script>
</body>
</html>
