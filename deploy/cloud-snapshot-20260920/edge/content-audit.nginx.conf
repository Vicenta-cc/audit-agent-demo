server {
    listen 80;
    server_name content-audit.guixucloud.cn;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name content-audit.guixucloud.cn;
    ssl_certificate     /etc/letsencrypt/live/content-audit.guixucloud.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/content-audit.guixucloud.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2g;
    location / {
        set $up_content_audit http://172.19.0.1:13198;
        proxy_pass $up_content_audit;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_force_ranges on;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
