<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>30 条复核结果 · 内容巡查</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#203347;background:#f3f6f9;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,a,select{cursor:pointer}button{border:1px solid #d9e2e9;background:white;border-radius:8px;padding:9px 13px;color:inherit}button:hover{border-color:#0e9488}button:focus-visible,a:focus-visible{outline:3px solid #72d7ca}button:disabled{opacity:.45;cursor:default}a{color:#087f76;text-decoration:none}.top{height:62px;background:#142c3d;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 30px}.brand{font-weight:700;letter-spacing:.6px}.top a{color:#b9dedb}.wrap{max-width:1480px;margin:auto;padding:28px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.3px;color:#078c80}h1{font-size:28px;letter-spacing:-.6px;margin:8px 0}h2{font-size:20px;margin:0 0 12px}h3{font-size:15px;margin:0 0 12px}p{line-height:1.65}.muted{color:#6d7d8b;font-size:13px}.notice{background:#e9f3f1;border:1px solid #cde4df;padding:12px 16px;border-radius:10px;line-height:1.6;margin:20px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}.stat{padding:18px 20px;border:1px solid #dfe6ec;border-radius:12px;background:white}.stat b{display:block;font-size:29px;margin-top:6px;font-variant-numeric:tabular-nums}.stat.ok b{color:#087e73}.stat.fail b{color:#b95b2d}.layout{display:grid;grid-template-columns:minmax(300px,430px) minmax(0,1fr);gap:20px;align-items:start}.panel{border:1px solid #dce4eb;border-radius:13px;background:white;overflow:hidden}.filters{padding:16px;border-bottom:1px solid #e4eaf0;display:flex;gap:8px}.filters input{width:100%;min-width:0;padding:9px 10px;border:1px solid #d5dfe7;border-radius:7px}.filters select{max-width:140px;border:1px solid #d5dfe7;border-radius:7px;background:white}.list{max-height:70vh;overflow:auto}.post{display:block;width:100%;text-align:left;border:0;border-radius:0;border-bottom:1px solid #e7edf2;padding:16px 18px}.post.selected{background:#edf8f5;box-shadow:inset 3px 0 #0d9488}.row{display:flex;gap:9px;align-items:center;justify-content:space-between}.post-title{font-weight:600;line-height:1.55;margin:9px 0;overflow-wrap:anywhere}.number{font-size:12px;color:#758998}.badge{display:inline-block;font-size:11px;padding:4px 8px;border-radius:5px;background:#edf2f5;white-space:nowrap}.good{background:#e2f4ed;color:#167755}.bad{background:#fff0e5;color:#a75623}.risk{background:#ffe9e8;color:#a83e42}.detail{padding:24px;min-height:420px;overflow-wrap:anywhere}.tabs{display:flex;gap:6px;border-bottom:1px solid #e4eaf0;margin:18px 0;padding-bottom:12px;flex-wrap:wrap}.tabs button.active{background:#0b8178;color:white;border-color:#0b8178}.bodytext{white-space:pre-wrap;line-height:1.75}.box{background:#f7f9fb;border:1px solid #e4eaf0;padding:16px;border-radius:9px;margin:12px 0}.failure{border-color:#efd5bf;background:#fff6ef}.media{display:flex;gap:10px;overflow-x:auto;padding:8px 0}.media img{height:230px;max-width:100%;object-fit:contain;border-radius:8px;background:#edf1f5}.media video{width:min(100%,470px);max-height:390px;border-radius:8px;background:#172530}.comment{padding:15px 0;border-bottom:1px solid #e5eaf0}.comment p{margin:8px 0;white-space:pre-wrap}.commentbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.commentbar select{padding:7px;border:1px solid #d5dfe7;border-radius:7px}.paging{display:flex;justify-content:space-between;align-items:center;margin-top:18px}.empty{padding:36px;text-align:center;color:#71818f}.evidence{margin:12px 0;border-left:3px solid #24a49a;padding:12px 16px;background:#f4f9f8;border-radius:0 8px 8px 0}.evidence p{white-space:pre-wrap}.footer{margin:22px 0;color:#788896;font-size:12px}.detail .row{align-items:flex-start}#error{color:#a44030}.linkout{white-space:nowrap}small{color:#758493}.detail h2{line-height:1.5}@media(max-width:850px){.wrap{padding:16px}.layout{grid-template-columns:1fr}.list{max-height:330px}.stats{gap:8px}.stat{padding:12px}.stat b{font-size:24px}.top{padding:0 16px}.detail{padding:18px}h1{font-size:23px}}
</style></head><body>
<header class="top"><div class="brand">内容巡查研判平台 <span style="color:#8eb5bf;font-weight:400"> / 本地验收</span></div><a href="/investigation">返回调查工作区 ↗</a></header>
<main class="wrap"><div class="eyebrow">RE-AUDIT SNAPSHOT · 只读复核快照</div><h1>抖音 · 色情服务引流</h1><div class="muted">综合优先 · 每关键词 10 条 / 总量 30 条 · 每帖最多 300 评论 · Thinking 关闭</div>
<div class="notice">这里展示原 10 条成功结果与失败 20 条的最新复核结果。<strong>审核失败不等于“无风险”或“违规”。</strong>这是只读验收视图，不覆盖原报告；原报告问答仍基于原来冻结的 10 条。</div>
<section class="stats" aria-label="复核统计"><div class="stat">采集帖子<b id="total">—</b></div><div class="stat ok">审核成功<b id="completed">—</b></div><div class="stat fail">审核失败<b id="failed">—</b></div><div class="stat">保留原成功结果<b id="retained">—</b></div></section>
<div id="error" role="alert"></div><section class="layout"><div class="panel"><div class="filters"><input id="search" aria-label="搜索帖子" placeholder="搜索标题、作者、帖子 ID"><select id="status" aria-label="筛选审核状态"><option value="all">全部 30 条</option><option value="completed">审核成功</option><option value="failed">审核失败</option><option value="reaudit">本次复核 20 条</option></select></div><div id="list" class="list" aria-label="帖子目录"><div class="empty">正在读取复核快照…</div></div></div><article id="detail" class="panel detail" aria-live="polite"><div class="empty">选择一条帖子查看结果</div></article></section>
<div class="footer">只读取本机复核副本及已采集媒体 · 不创建任务，不调用模型，不上传数据</div></main>
<script>
'use strict';
const base=location.pathname.replace(/\/view\/?$/,''), $=id=>document.getElementById(id);
let cards=[],selected='',current=null,tab='overview',commentPage=1,commentFilter='all',requestSerial=0;
const riskNames={high:'高风险',medium:'中风险',low:'低风险',none:'无风险'};
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=String(text);if(cls)e.className=cls;return e}
function badge(text,cls=''){return el('span',text,'badge '+cls)}
function risk(p){return p.status==='failed'?'审核未完成':riskNames[p.risk_level]||'已完成审核'}
async function get(url){const r=await fetch(url,{credentials:'same-origin',cache:'no-store'});if(!r.ok)throw new Error(r.status===401?'登录已失效，请返回调查工作区重新登录。':`读取失败（${r.status}），请确认本地复核环境。`);return r.json()}
function safeLink(url,label){try{const u=new URL(url);if(!['http:','https:'].includes(u.protocol))return el('span','来源链接不可用','muted');const a=el('a',label,'linkout');a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';return a}catch{return el('span','无来源链接','muted')}}
function drawList(){const q=$('search').value.toLowerCase(),f=$('status').value;const items=cards.filter(p=>(f==='all'||p.status===f||(f==='reaudit'&&p.origin==='reaudit'))&&`${p.title} ${p.author} ${p.note_id}`.toLowerCase().includes(q));$('list').replaceChildren();if(!items.length){$('list').append(el('div','没有匹配帖子','empty'));return}for(const p of items){const b=el('button',undefined,'post'+(p.note_id===selected?' selected':''));b.setAttribute('aria-label',`第${p.order}条 ${p.title}`);b.setAttribute('aria-pressed',String(p.note_id===selected));const top=el('div',undefined,'row');top.append(el('span',`#${String(p.order).padStart(2,'0')} · ${p.origin==='retained'?'原成功结果':'本次复核'}`,'number'),badge(risk(p),p.status==='failed'?'bad':p.risk_level==='high'?'risk':'good'));b.append(top,el('div',p.title,'post-title'),el('div',`${p.author} · ${p.comments_count} 条已采集评论`,'muted'));b.onclick=()=>loadPost(p.note_id);$('list').append(b)}}
async function loadPost(id){selected=id;drawList();const serial=++requestSerial;current=null;$('detail').replaceChildren(el('div','正在读取帖子详情…','empty'));try{const data=await get(`${base}/posts/${encodeURIComponent(id)}`);if(serial!==requestSerial)return;current=data;tab='overview';commentPage=1;commentFilter='all';drawDetail()}catch(e){if(serial===requestSerial)$('detail').replaceChildren(el('p',e.message))}}
function drawDetail(){const p=current,d=$('detail');d.replaceChildren();const head=el('div',undefined,'row');head.append(badge(`#${p.order} · ${p.status==='completed'?'审核成功':'审核失败'}`,p.status==='completed'?'good':'bad'),safeLink(p.url,'查看抖音原帖 ↗'));d.append(head,el('h2',p.title),el('div',`${p.author} · 帖子 ${p.note_id}`,'muted'));const tabs=el('div',undefined,'tabs');for(const [key,title]of [['overview','结论与正文'],['comments',`评论 ${p.comments.length}`],['evidence',`风险证据 ${p.evidence.length}`]]){const b=el('button',title,tab===key?'active':'');b.onclick=()=>{tab=key;drawDetail()};tabs.append(b)}d.append(tabs);if(tab==='overview')overview(d,p);else if(tab==='comments')comments(d,p);else evidence(d,p)}
function overview(d,p){if(p.failure){const b=el('div',undefined,'box failure');b.append(el('h3','审核未完成'),el('p',p.failure.reason),el('small',`阶段：${p.failure.stage} · 错误码：${p.failure.code}`));d.append(b)}else{const b=el('div',undefined,'box');b.append(el('h3',risk(p)),el('p',p.summary||'无额外总结'));d.append(b)}d.append(el('h3','帖子正文'),el('div',p.body||'无正文','bodytext'));if(p.media.length){d.append(el('h3','已采集原始媒体'),el('p','以下为已采集原始媒体，不代表每张图片均被选入视觉审核。','muted'));const media=el('div',undefined,'media');for(const m of p.media){const e=el(m.type==='video'?'video':'img');e.src=`${base}/posts/${encodeURIComponent(p.note_id)}/media/${m.index}`;if(m.type==='video'){e.controls=true;e.preload='metadata'}else{e.alt=`帖子原图 ${m.index+1}`;e.loading='lazy'}media.append(e)}d.append(media)}else d.append(el('p','该帖子没有可展示的本地媒体。','muted'))}
function comments(d,p){if(!p.comments_audited)d.append(el('div','该帖整条审核未完成。以下仅展示已采集原始评论，不伪造完整的评论审核结论。','box failure'));const bar=el('div',undefined,'commentbar');const sel=el('select');sel.setAttribute('aria-label','筛选评论风险');for(const [v,t]of [['all','全部评论'],['risk','仅风险评论']]){const o=el('option',t);o.value=v;sel.append(o)}sel.value=commentFilter;sel.disabled=!p.comments_audited;sel.onchange=()=>{commentFilter=sel.value;commentPage=1;drawDetail()};bar.append(sel,el('span','每页 20 条；按需展开，不一次堆满。','muted'));d.append(bar);const items=p.comments.filter(c=>commentFilter==='all'||Number(c.risk_score)>0),pages=Math.max(1,Math.ceil(items.length/20));commentPage=Math.min(commentPage,pages);for(const c of items.slice((commentPage-1)*20,commentPage*20)){const b=el('div',undefined,'comment'),head=el('div',undefined,'row');head.append(el('strong',c.nickname||'未知评论者'),badge(p.comments_audited?`${c.risk_score??'—'} 分 · ${riskNames[c.risk_level]||c.audit_status||'未标注'}`:'仅原始评论',p.comments_audited&&Number(c.risk_score)>0?'risk':''));b.append(head,el('p',c.source_text||c.content||''));if(c.translation_zh)b.append(el('p','译文：'+c.translation_zh));if(p.comments_audited&&c.risk_basis)b.append(el('div','依据：'+c.risk_basis,'muted'));b.append(el('small','评论 ID：'+(c.comment_id||'未记录')));d.append(b)}if(!items.length)d.append(el('div','没有匹配评论','empty'));const nav=el('div',undefined,'paging'),prev=el('button','上一页'),next=el('button','下一页');prev.disabled=commentPage===1;next.disabled=commentPage===pages;prev.onclick=()=>{commentPage--;drawDetail()};next.onclick=()=>{commentPage++;drawDetail()};nav.append(prev,el('span',`${commentPage} / ${pages} 页 · 共 ${items.length} 条`,'muted'),next);d.append(nav)}
function evidence(d,p){if(!p.evidence.length){d.append(el('div',p.status==='failed'?'该帖审核未完成，没有可作为最终结论展示的风险证据。':'没有记录到风险证据。','empty'));return}for(const e of p.evidence){const b=el('div',undefined,'evidence');b.append(badge(e.modality||e.primary_modality||'证据'),el('p',e.reason||e.text||e.quote||'风险依据'));if(e.translation_zh||e.source_text_dolphin)b.append(el('p',e.translation_zh||e.source_text_dolphin));b.append(el('small',`规则 ${e.rule_id||'未记录'} · 引用 ${e.evidence_id||e.source||'未记录'}`));d.append(b)}}
$('search').oninput=drawList;$('status').onchange=drawList;
get(base).then(data=>{cards=data.items;for(const k of ['total','completed','failed','retained'])$(k).textContent=data.counts[k];$('status').options[0].textContent=`全部 ${data.counts.total} 条`;drawList();if(cards.length)loadPost(cards[0].note_id)}).catch(e=>{$('error').textContent=e.message;$('list').replaceChildren(el('div','无法读取复核数据','empty'))});
</script></body></html>
